# Local development only - production Postgres is self-hosted separately
# (BigRock VPS via Podman). Run: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: disha
      POSTGRES_PASSWORD: disha_dev_only
      POSTGRES_DB: disha_dev
    ports:
      - "5432:5432"
    volumes:
      - disha_dev_pgdata:/var/lib/postgresql/data

volumes:
  disha_dev_pgdata:
